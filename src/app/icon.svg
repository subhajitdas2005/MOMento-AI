<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" rx="12" fill="#090A0F" />
  <rect width="48" height="48" rx="12" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.3" />
  
  <defs>
    <linearGradient id="favicon-grad" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2DD4BF" />
      <stop offset="50%" stopColor="#06B6D4" />
